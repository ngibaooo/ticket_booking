
services:
  postgres:
    image: postgres:18
    container_name: ticket-booking-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticket_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticket_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ticket-booking-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
